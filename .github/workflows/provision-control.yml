name: Provision Telegram Webhook
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [seal, enable]
        default: seal
permissions:
  contents: write
concurrency:
  group: shining-news-radar
  cancel-in-progress: false
jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provision credential or enable tested webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python ops/provision_control.py "${{ inputs.mode }}"
      - name: Save sealed credential
        if: inputs.mode == 'seal'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Telegram-AI-News-Radar-v1.0/sealed-control-token.json Telegram-AI-News-Radar-v1.0/initial-control-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Seal Telegram credential for webhook"
            git push
          fi
