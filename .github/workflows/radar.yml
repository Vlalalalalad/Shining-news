
name: Shining Auto News Bot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/radar.yml'
      - '.github/workflows/control.yml'
      - 'Telegram-AI-News-Radar-v1.0/radar.py'
      - 'Telegram-AI-News-Radar-v1.0/control.py'
      - 'Telegram-AI-News-Radar-v1.0/config.json'
      - 'Telegram-AI-News-Radar-v1.0/test_radar.py'
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        type: choice
        options:
          - test
          - live
        default: test

permissions:
  contents: write

concurrency:
  group: shining-news-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify radar logic without publishing
        run: python -m unittest discover -s Telegram-AI-News-Radar-v1.0 -p 'test_*.py'

      - name: Run news radar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
          DRY_RUN: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'test') }}
        run: python Telegram-AI-News-Radar-v1.0/radar.py

      - name: Save history
        if: ${{ vars.PUBLISH_ENABLED == 'true' && (github.event_name == 'schedule' || inputs.mode == 'live') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Telegram-AI-News-Radar-v1.0/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update news radar state"
            git push
          fi
