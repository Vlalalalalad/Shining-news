
name: Telegram AI News Radar

on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'test = no posts; live = publish'
        required: true
        default: test
        type: choice
        options:
          - test
          - live

permissions:
  contents: write

concurrency:
  group: news-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan and publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'test' }}
        run: python radar.py

      - name: Save history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update AI News Radar state [skip ci]'
            git push
          else
            echo 'No state changes'
          fi
        
